[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-criteria-assessment"
version = "1.0.0"
description = "API and ML workspace for handwriting criteria assessment"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
ml = [
  "numpy>=2.0,<3",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[project.scripts]
train-emnist-digits = "handwriting_ml.train_digits:main"
evaluate-handwriting = "handwriting_ml.evaluate_manifest:main"

[tool.setuptools.packages.find]
where = ["api", "ml/src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "api", "ml/src"]
testpaths = ["api/tests", "ml/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
